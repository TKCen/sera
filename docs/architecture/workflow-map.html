<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SERA workflow map</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1c2030;
    --border: #2a3045;
    --text: #d8dde8;
    --text-dim: #8a93a8;
    --accent: #f5a623;
    --accent-2: #4ea7ff;
    --active: #2ecc71;
    --speculative: #f5a623;
    --legacy: #6b6b6b;
    --partial: #b18bff;
    --unknown: #4a5060;
    --kind-request: #4ea7ff;
    --kind-response: #2ecc71;
    --kind-internal: #b18bff;
    --kind-async: #f5a623;
    --kind-persist: #ff7ab6;
    --kind-external: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; height: 100%; }
  body { display: grid; grid-template-columns: 260px 1fr 380px; grid-template-rows: 56px 1fr; height: 100vh; }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  header .accent { color: var(--accent); }
  header .sub { color: var(--text-dim); font-size: 12px; }
  header code.inline { background: var(--panel-2); padding: 1px 5px; border-radius: 3px; }
  header .spacer { flex: 1; }
  header .controls { display: flex; gap: 8px; align-items: center; }
  header button, header label.btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  header button:hover, header label.btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
  header input[type="file"] { display: none; }

  aside.flows {
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 8px;
  }
  aside.flows h2, aside.detail h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
    margin: 4px 8px 8px; font-weight: 600;
  }
  .flow-item {
    display: block; width: 100%;
    text-align: left;
    background: transparent; border: 1px solid transparent;
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 2px;
    line-height: 1.3;
  }
  .flow-item .tag { display: inline-block; margin-left: 6px; font-size: 10px; padding: 1px 6px; border-radius: 10px; vertical-align: middle; }
  .flow-item .tag.status-active { background: rgba(46,204,113,0.15); color: #6ee0a0; }
  .flow-item .tag.status-speculative { background: rgba(245,166,35,0.15); color: var(--speculative); }
  .flow-item .tag.status-legacy { background: rgba(107,107,107,0.2); color: #aaa; }
  .flow-item .tag.status-partial { background: rgba(177,139,255,0.15); color: var(--partial); }
  .flow-item .tag.status-unknown { background: rgba(74,80,96,0.25); color: #9aa1b3; }
  .flow-item:hover { background: var(--panel-2); border-color: var(--border); }
  .flow-item.active { background: var(--panel-2); border-color: var(--accent); color: #fff; }
  .flow-item .summary { display: block; color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  main {
    overflow: auto;
    background: radial-gradient(circle at 20% 0%, #1a1f2e 0%, var(--bg) 60%);
    position: relative;
  }
  #graph { display: block; }
  .col-label {
    fill: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .node rect {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1;
    rx: 8;
  }
  .node text.title {
    fill: var(--text);
    font-size: 12px;
    font-weight: 600;
    font-family: ui-sans-serif, system-ui, sans-serif;
    pointer-events: none;
  }
  .node text.subtitle {
    fill: var(--text-dim);
    font-size: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    pointer-events: none;
  }
  .node:hover rect { stroke: var(--accent-2); }
  .node.dim { opacity: 0.22; }
  .node.touched rect { stroke: var(--accent); stroke-width: 1.5; filter: drop-shadow(0 0 6px rgba(245,166,35,0.35)); }
  .node.start rect { fill: #1e2a1e; stroke: var(--active); }
  .node.end rect { fill: #1e2a1e; stroke: var(--active); }

  .node.status-speculative rect { stroke-dasharray: 4 3; }
  .node.status-legacy rect { fill: #14151a; }
  .node.status-legacy text.title { fill: #7a7f8b; font-style: italic; }
  .node.status-partial rect { stroke: var(--partial); stroke-dasharray: 4 3; }
  .node.status-unknown rect { fill: #14151a; stroke: var(--unknown); stroke-dasharray: 2 4; }
  .node.status-unknown text.title { fill: #7a7f8b; font-style: italic; }

  .edge { fill: none; stroke-width: 1.5; }
  .edge.kind-request  { stroke: var(--kind-request); }
  .edge.kind-response { stroke: var(--kind-response); }
  .edge.kind-internal { stroke: var(--kind-internal); }
  .edge.kind-async    { stroke: var(--kind-async); stroke-dasharray: 6 4; }
  .edge.kind-persist  { stroke: var(--kind-persist); }
  .edge.kind-external { stroke: var(--kind-external); }
  .edge-num {
    fill: #fff;
    font-size: 10px;
    font-weight: 700;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    cursor: pointer;
  }
  .edge-num-bg {
    fill: var(--panel);
    stroke: var(--accent);
    stroke-width: 1;
  }
  .edge.highlight-step { stroke-width: 3; filter: drop-shadow(0 0 4px currentColor); }

  aside.detail {
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 14px 16px;
  }
  aside.detail .flow-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  aside.detail .flow-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  aside.detail .flow-meta code { background: var(--panel-2); padding: 1px 4px; border-radius: 3px; }
  aside.detail .flow-summary { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 14px; }
  aside.detail .flow-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  aside.detail .flow-tags span { background: var(--panel-2); border: 1px solid var(--border); padding: 1px 8px; border-radius: 10px; font-size: 10px; color: var(--text-dim); }

  ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: step; }
  ol.steps li {
    position: relative;
    padding: 8px 10px 8px 36px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
    background: var(--panel-2);
  }
  ol.steps li:hover { border-color: var(--accent-2); }
  ol.steps li.active { border-color: var(--accent); background: #1f2435; }
  ol.steps li::before {
    counter-increment: step;
    content: counter(step);
    position: absolute; left: 8px; top: 8px;
    width: 20px; height: 20px; line-height: 20px; text-align: center;
    border-radius: 50%; background: var(--panel); border: 1px solid var(--accent);
    font-size: 11px; font-weight: 700; color: var(--accent);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  ol.steps .arrow { color: var(--text-dim); margin: 0 4px; }
  ol.steps .from, ol.steps .to { color: var(--accent-2); }
  ol.steps .label { display: block; margin-top: 2px; color: var(--text); }
  ol.steps .note { display: block; margin-top: 4px; color: var(--text-dim); font-size: 11px; font-style: italic; border-left: 2px solid var(--border); padding-left: 8px; }
  ol.steps .kind { display: inline-block; padding: 0 6px; font-size: 9px; border-radius: 8px; vertical-align: middle; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 4px; }
  .kind-pill-request  { background: rgba(78,167,255,0.18); color: var(--kind-request); }
  .kind-pill-response { background: rgba(46,204,113,0.18); color: var(--kind-response); }
  .kind-pill-internal { background: rgba(177,139,255,0.18); color: var(--kind-internal); }
  .kind-pill-async    { background: rgba(245,166,35,0.18); color: var(--kind-async); }
  .kind-pill-persist  { background: rgba(255,122,182,0.18); color: var(--kind-persist); }
  .kind-pill-external { background: rgba(255,107,107,0.18); color: var(--kind-external); }
  .status-active { color: var(--active); }
  .status-speculative { color: var(--speculative); }
  .status-partial { color: var(--partial); }
  .status-legacy { color: var(--legacy); }

  .empty { color: var(--text-dim); padding: 16px; font-size: 13px; line-height: 1.5; }
  .empty code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .legend { font-size: 11px; color: var(--text-dim); padding: 10px 8px; border-top: 1px solid var(--border); margin-top: 10px; }
  .legend strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .legend .lk { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; margin-bottom: 4px; }
  .legend .lk i { display: inline-block; width: 18px; height: 2px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>SERA <span class="accent">workflow map</span></h1>
  <span class="sub">Data-driven explorer · driven by <code class="inline">workflow-flows.json</code></span>
  <div class="spacer"></div>
  <div class="controls">
    <label class="btn" for="json-input" title="If you opened this from disk and fetch is blocked, browse to workflow-flows.json here.">Load JSON…</label>
    <input id="json-input" type="file" accept=".json,application/json">
    <button id="clear-btn">Clear selection</button>
  </div>
</header>

<aside class="flows">
  <h2>Flows</h2>
  <div id="flow-list"></div>
  <div class="legend">
    <strong>Edge kinds</strong>
    <div class="lk"><i style="background:var(--kind-request)"></i>request</div>
    <div class="lk"><i style="background:var(--kind-response)"></i>response</div>
    <div class="lk"><i style="background:var(--kind-internal)"></i>internal</div>
    <div class="lk"><i style="background:var(--kind-async)"></i>async (dashed)</div>
    <div class="lk"><i style="background:var(--kind-persist)"></i>persist</div>
    <div class="lk"><i style="background:var(--kind-external)"></i>external</div>
    <strong style="margin-top:10px">Component status</strong>
    <div>Solid = active · Dashed = speculative / partial · Italic grey = legacy · Dotted dim = unknown (explicitly absent)</div>
  </div>
</aside>

<main>
  <svg id="graph"></svg>
  <div id="empty-state" class="empty" style="display:none"></div>
</main>

<aside class="detail">
  <div id="detail-pane"></div>
</aside>

<script>
"use strict";
const SVG_NS = "http://www.w3.org/2000/svg";
const COL_W = 220;
const COL_GAP = 30;
const ROW_H = 64;
const PAD_TOP = 50;
const NODE_W = 200;
const NODE_H = 48;

let data = null;
let selectedFlowId = null;
let selectedStepIdx = null;
let nodeIndex = {};

function svgEl(tag, attrs, children) {
  const e = document.createElementNS(SVG_NS, tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v === undefined || v === null) continue;
      e.setAttribute(k, v);
    }
  }
  if (children) {
    for (const c of children) {
      if (c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
  }
  return e;
}

function htmlEl(tag, options) {
  const e = document.createElement(tag);
  if (!options) return e;
  if (options.className) e.className = options.className;
  if (options.text != null) e.textContent = String(options.text);
  if (options.attrs) {
    for (const k of Object.keys(options.attrs)) {
      e.setAttribute(k, options.attrs[k]);
    }
  }
  if (options.children) {
    for (const c of options.children) {
      if (c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
  }
  return e;
}

function colForComponent(component) {
  const cat = data.categories.find(c => c.id === component.category);
  if (cat) return cat.col;
  return component.position && typeof component.position.col === "number" ? component.position.col : 0;
}

function nodeCenter(component) {
  const col = colForComponent(component);
  const row = component.position && typeof component.position.row === "number" ? component.position.row : 0;
  const x = col * (COL_W + COL_GAP) + NODE_W / 2 + 20;
  const y = PAD_TOP + row * ROW_H + NODE_H / 2;
  return { x: x, y: y };
}

function nodeBox(component) {
  const c = nodeCenter(component);
  return { x: c.x - NODE_W / 2, y: c.y - NODE_H / 2, w: NODE_W, h: NODE_H, cx: c.x, cy: c.y };
}

function boxAnchor(box, tx, ty) {
  const dx = tx - box.cx, dy = ty - box.cy;
  if (dx === 0 && dy === 0) return { x: box.cx, y: box.cy };
  const halfW = box.w / 2, halfH = box.h / 2;
  const sx = dx === 0 ? Infinity : halfW / Math.abs(dx);
  const sy = dy === 0 ? Infinity : halfH / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: box.cx + dx * s, y: box.cy + dy * s };
}

function render() {
  const svg = document.getElementById("graph");
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const cols = data.components.map(colForComponent);
  const maxCol = cols.length ? Math.max.apply(null, cols) : 0;
  const rows = data.components.map(c => c.position && typeof c.position.row === "number" ? c.position.row : 0);
  const maxRow = rows.length ? Math.max.apply(null, rows) : 0;
  const width  = (maxCol + 1) * (COL_W + COL_GAP) + 40;
  const height = PAD_TOP + (maxRow + 1) * ROW_H + 40;
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);

  for (const cat of data.categories) {
    const x = cat.col * (COL_W + COL_GAP) + 20 + NODE_W / 2;
    svg.appendChild(svgEl("text", { class: "col-label", x: x, y: 24, "text-anchor": "middle" }, [cat.label]));
  }

  const kinds = ["request", "response", "internal", "async", "persist", "external"];
  const defs = svgEl("defs");
  for (const k of kinds) {
    const color = getComputedStyle(document.documentElement).getPropertyValue("--kind-" + k).trim();
    defs.appendChild(svgEl("marker", {
      id: "arrow-" + k, viewBox: "0 0 10 10",
      refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto"
    }, [
      svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: color })
    ]));
  }
  svg.appendChild(defs);

  let flow = null;
  const touched = new Set();
  const stepEdges = [];
  if (selectedFlowId) {
    flow = data.flows.find(f => f.id === selectedFlowId);
    if (flow) {
      for (let i = 0; i < flow.steps.length; i++) {
        const s = flow.steps[i];
        touched.add(s.from);
        touched.add(s.to);
        stepEdges.push({ step: s, idx: i });
      }
    }
  }

  if (flow) {
    const pairCounts = {};
    const pairSeen = {};
    for (const e of stepEdges) {
      const k = e.step.from + "->" + e.step.to;
      pairCounts[k] = (pairCounts[k] || 0) + 1;
    }
    for (const e of stepEdges) {
      const step = e.step;
      const idx = e.idx;
      const fromN = nodeIndex[step.from];
      const toN = nodeIndex[step.to];
      if (!fromN || !toN) continue;
      const a = nodeBox(fromN), b = nodeBox(toN);
      const pairKey = step.from + "->" + step.to;
      pairSeen[pairKey] = (pairSeen[pairKey] || 0) + 1;
      const total = pairCounts[pairKey];
      const seenIdx = pairSeen[pairKey] - 1;
      const offset = (seenIdx - (total - 1) / 2) * 14;

      const dx = b.cx - a.cx, dy = b.cy - a.cy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = -dy / dist, ny = dx / dist;
      const fromAnchor = boxAnchor(a, b.cx, b.cy);
      const toAnchor = boxAnchor(b, a.cx, a.cy);
      const bow = 40 + offset;
      const midX = (fromAnchor.x + toAnchor.x) / 2 + nx * bow;
      const midY = (fromAnchor.y + toAnchor.y) / 2 + ny * bow;
      const kind = step.kind || "internal";
      const cls = "edge kind-" + kind + (selectedStepIdx === idx ? " highlight-step" : "");
      const path = svgEl("path", {
        d: "M " + fromAnchor.x + " " + fromAnchor.y + " Q " + midX + " " + midY + " " + toAnchor.x + " " + toAnchor.y,
        class: cls,
        "marker-end": "url(#arrow-" + kind + ")"
      });
      path.addEventListener("click", function () { selectStep(idx); });
      path.style.cursor = "pointer";
      svg.appendChild(path);

      const numCx = midX * 0.5 + ((fromAnchor.x + toAnchor.x) / 2) * 0.5;
      const numCy = midY * 0.5 + ((fromAnchor.y + toAnchor.y) / 2) * 0.5;
      svg.appendChild(svgEl("circle", { class: "edge-num-bg", cx: numCx, cy: numCy, r: 10 }));
      const numText = svgEl("text", { class: "edge-num", x: numCx, y: numCy + 3.5, "text-anchor": "middle" }, [String(idx + 1)]);
      numText.addEventListener("click", function () { selectStep(idx); });
      svg.appendChild(numText);
    }
  }

  for (const c of data.components) {
    const box = nodeBox(c);
    const status = c.status || "active";
    const classes = ["node", "status-" + status];
    if (flow) {
      if (touched.has(c.id)) {
        classes.push("touched");
        if (flow.steps[0] && flow.steps[0].from === c.id) classes.push("start");
        if (flow.steps[flow.steps.length - 1] && flow.steps[flow.steps.length - 1].to === c.id) classes.push("end");
      } else {
        classes.push("dim");
      }
    }
    const g = svgEl("g", { class: classes.join(" "), transform: "translate(" + box.x + "," + box.y + ")" });
    g.appendChild(svgEl("rect", { width: NODE_W, height: NODE_H }));
    g.appendChild(svgEl("text", { class: "title", x: 10, y: 18 }, [c.name]));
    const summary = c.summary || "";
    const sub = summary.length > 48 ? (summary.slice(0, 46) + "…") : summary;
    g.appendChild(svgEl("text", { class: "subtitle", x: 10, y: 34 }, [sub]));
    g.appendChild(svgEl("title", {}, [c.name + "\n" + summary + "\nstatus: " + status + " · kind: " + c.kind]));
    svg.appendChild(g);
  }
}

function renderFlowList() {
  const list = document.getElementById("flow-list");
  while (list.firstChild) list.removeChild(list.firstChild);
  for (const f of data.flows) {
    const btn = htmlEl("button", {
      className: "flow-item" + (f.id === selectedFlowId ? " active" : ""),
      children: [
        htmlEl("strong", { text: f.name }),
        htmlEl("span", { className: "tag status-" + f.status, text: f.status }),
        htmlEl("span", { className: "summary", text: truncate(f.summary, 90) })
      ]
    });
    btn.addEventListener("click", function () { selectFlow(f.id); });
    list.appendChild(btn);
  }
}

function truncate(s, n) {
  if (!s) return "";
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

function renderDetail() {
  const pane = document.getElementById("detail-pane");
  while (pane.firstChild) pane.removeChild(pane.firstChild);
  pane.appendChild(htmlEl("h2", { text: "Selected flow" }));

  if (!selectedFlowId) {
    pane.appendChild(htmlEl("p", { className: "empty", attrs: { style: "padding:0" }, text: "Click a flow on the left to highlight involved components and inspect each step's payload." }));
    return;
  }
  const flow = data.flows.find(f => f.id === selectedFlowId);
  if (!flow) return;

  pane.appendChild(htmlEl("div", { className: "flow-title", text: flow.name }));

  const meta = htmlEl("div", { className: "flow-meta" });
  meta.appendChild(document.createTextNode("id: "));
  meta.appendChild(htmlEl("code", { text: flow.id }));
  meta.appendChild(document.createTextNode(" · status: "));
  meta.appendChild(htmlEl("strong", { className: "status-" + flow.status, text: flow.status }));
  meta.appendChild(document.createTextNode(" · " + flow.steps.length + " steps"));
  pane.appendChild(meta);

  pane.appendChild(htmlEl("p", { className: "flow-summary", text: flow.summary }));

  if (flow.tags && flow.tags.length) {
    const tagWrap = htmlEl("div", { className: "flow-tags" });
    for (const t of flow.tags) tagWrap.appendChild(htmlEl("span", { text: t }));
    pane.appendChild(tagWrap);
  }

  const ol = htmlEl("ol", { className: "steps" });
  for (let i = 0; i < flow.steps.length; i++) {
    const s = flow.steps[i];
    const fromN = nodeIndex[s.from];
    const toN = nodeIndex[s.to];
    const kind = s.kind || "internal";
    const li = htmlEl("li", { attrs: { "data-step": String(i) } });
    if (i === selectedStepIdx) li.className = "active";

    li.appendChild(htmlEl("span", { className: "from", text: fromN ? fromN.name : s.from }));
    li.appendChild(htmlEl("span", { className: "arrow", text: " → " }));
    li.appendChild(htmlEl("span", { className: "to", text: toN ? toN.name : s.to }));
    li.appendChild(htmlEl("span", { className: "kind kind-pill-" + kind, text: kind }));
    li.appendChild(htmlEl("span", { className: "label", text: s.label }));
    if (s.note) li.appendChild(htmlEl("span", { className: "note", text: s.note }));

    li.addEventListener("click", function () { selectStep(i); });
    ol.appendChild(li);
  }
  pane.appendChild(ol);
}

function selectFlow(id) {
  selectedFlowId = id;
  selectedStepIdx = null;
  renderFlowList();
  renderDetail();
  render();
}

function selectStep(idx) {
  selectedStepIdx = idx;
  renderDetail();
  render();
}

function clearSelection() {
  selectedFlowId = null;
  selectedStepIdx = null;
  renderFlowList();
  renderDetail();
  render();
}

function loadData(d) {
  if (!d || !Array.isArray(d.components) || !Array.isArray(d.flows) || !Array.isArray(d.categories)) {
    showLoadError(new Error("Invalid workflow-flows.json shape"));
    return;
  }
  data = d;
  nodeIndex = {};
  for (const c of data.components) nodeIndex[c.id] = c;
  document.getElementById("empty-state").style.display = "none";
  document.getElementById("graph").style.display = "";
  renderFlowList();
  render();
  renderDetail();
}

function showLoadError(err) {
  const slot = document.getElementById("empty-state");
  while (slot.firstChild) slot.removeChild(slot.firstChild);
  slot.style.display = "";
  document.getElementById("graph").style.display = "none";

  slot.appendChild(htmlEl("p", { text: "Could not load workflow-flows.json automatically. This usually happens when the page is opened directly from disk (browsers block file:// fetches)." }));
  slot.appendChild(htmlEl("p", { text: "Either:" }));
  const ul = htmlEl("ul");
  const li1 = htmlEl("li");
  li1.appendChild(document.createTextNode("Use the "));
  li1.appendChild(htmlEl("strong", { text: "Load JSON…" }));
  li1.appendChild(document.createTextNode(" button above to pick the file manually, or"));
  ul.appendChild(li1);
  const li2 = htmlEl("li");
  li2.appendChild(document.createTextNode("Run "));
  li2.appendChild(htmlEl("code", { text: "python3 -m http.server" }));
  li2.appendChild(document.createTextNode(" from docs/architecture/ and open "));
  li2.appendChild(htmlEl("code", { text: "http://localhost:8000/workflow-map.html" }));
  li2.appendChild(document.createTextNode("."));
  ul.appendChild(li2);
  slot.appendChild(ul);

  if (err && err.message) {
    slot.appendChild(htmlEl("p", { attrs: { style: "color:#ff6b6b;font-size:11px" }, text: "Error: " + err.message }));
  }
  console.error("workflow-map: load error", err);
}

async function bootstrap() {
  try {
    const r = await fetch("./workflow-flows.json", { cache: "no-store" });
    if (!r.ok) throw new Error("fetch status " + r.status);
    const d = await r.json();
    loadData(d);
  } catch (err) {
    showLoadError(err);
  }
}

document.getElementById("json-input").addEventListener("change", function (evt) {
  const f = evt.target.files && evt.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function () {
    try {
      loadData(JSON.parse(String(reader.result)));
    } catch (e) {
      showLoadError(e);
    }
  };
  reader.readAsText(f);
});

document.getElementById("clear-btn").addEventListener("click", clearSelection);

renderDetail();
bootstrap();
</script>
</body>
</html>
